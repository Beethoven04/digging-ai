name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: finder/requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: n8n/tests/package-lock.json

      - name: Install
        run: pip install -r finder/requirements.txt -r finder/requirements-dev.txt

      - name: Privacy scan
        run: make privacy

      - name: Lint
        run: make lint

      - name: Build workflows (example campaign) and run the end-to-end scenario
        run: make test-n8n

      - name: Finder unit tests
        run: make test-finder
